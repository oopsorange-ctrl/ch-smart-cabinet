<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CH Smart Cabinet</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-48.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CH Cabinet">
<style>
:root{
  --wall:#d3d7da;--steel:#c3cbd1;--steel-hi:#e8edf0;--steel-lo:#d0d7dc;--edge:#7f8a92;
  --cav:#1b1f23;--box:#2f353a;--wallside:#3d454c;
  --card:#ffffff;--ink:#1d1d1b;--ink2:#555a5e;--ink3:#7d848a;--line:#c3cad0;
}
@media (prefers-color-scheme: dark){
  :root{--wall:#15181b;--steel:#3a4248;--steel-hi:#4a535a;--steel-lo:#3b4349;--edge:#20262a;--cav:#0d1013;--box:#23282c;--wallside:#30373d;
    --card:#262b2f;--ink:#eceeef;--ink2:#b4babf;--ink3:#8b9298;--line:#4d565d}
}
*{box-sizing:border-box}
html{background:var(--wall)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.6;
  background:var(--wall) repeating-linear-gradient(90deg,transparent 0,transparent 159px,rgba(0,0,0,.07) 159px,rgba(0,0,0,.07) 160px)}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:980px;margin:0 auto;padding:30px 20px 32px}

/* ===== 철제 캐비닛 ===== */
.lid{height:16px;margin:0 -10px;background:linear-gradient(var(--steel-hi),var(--steel));border:2px solid var(--edge);border-radius:7px 7px 2px 2px}
.cab{position:relative;padding:14px 16px 16px;border:2px solid var(--edge);border-top:none;border-bottom:none;display:flex;flex-direction:column;gap:14px;
  background:linear-gradient(90deg,rgba(0,0,0,.14),transparent 4%,transparent 96%,rgba(0,0,0,.14)),repeating-linear-gradient(0deg,rgba(255,255,255,.12) 0 1px,transparent 1px 3px),var(--steel)}
.plinth{height:20px;margin:0 8px;background:linear-gradient(#59636a,#3b4349);border:2px solid var(--edge);border-top:none;border-radius:0 0 5px 5px}
.feet{display:flex;justify-content:space-between;margin:0 30px}
.feet i{display:block;width:40px;height:8px;background:#2e353a;border-radius:0 0 5px 5px}

.front{position:relative;background:linear-gradient(var(--steel-hi),var(--steel-lo));border:2px solid var(--edge);border-radius:7px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.14)}
.pull-h{display:block;width:140px;height:17px;margin:0 auto;border-radius:3px 3px 11px 11px;background:linear-gradient(#a3adb4,#5c676f);
  box-shadow:0 2px 0 rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.55)}

/* 윗서랍: 이름표 */
.d1{padding:16px 16px 14px}
.holder{position:relative;background:linear-gradient(#a9b2b8,#8a949b);border-radius:6px;padding:6px;margin:0 26px 12px}
.holder::before,.holder::after{content:"";position:absolute;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#eef2f4,#7c868d);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.holder::before{left:-18px}.holder::after{right:-18px}
.label{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);border-radius:4px;padding:12px 16px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:48px;height:48px;border-radius:12px;background:var(--ink);color:var(--card);display:flex;align-items:center;justify-content:center;flex:none}
.logo svg{width:26px;height:26px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.2px}
.sub{margin:2px 0 0;font-size:14px;color:var(--ink2);line-height:1.55}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search{width:200px;max-width:100%;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.search:focus{outline:2px solid #378ADD;outline-offset:1px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 26px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:14px;padding:4px 14px;border-radius:999px;border:1px solid var(--edge);background:transparent;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.lock{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f1f4f6,#8c969d);border:1px solid var(--edge);position:relative;flex:none}
.lock::after{content:"";position:absolute;left:50%;top:6px;width:4px;height:12px;margin-left:-2px;border-radius:2px;background:#3a4147}

/* 가운데 서랍: 당겨 나오는 앱 서랍 */
.slot{position:relative;overflow:hidden;background:var(--cav);border-radius:5px;box-shadow:inset 0 14px 18px rgba(0,0,0,.7)}
.drawer{position:relative}
.box{background:var(--box);margin:0 12px;padding:14px 22px 22px;
  box-shadow:inset 16px 0 0 var(--wallside),inset -16px 0 0 var(--wallside),inset 0 12px 16px rgba(0,0,0,.45)}
.rail{height:9px;border-radius:5px;background:#9aa3aa;margin:0 0 20px}
.d2{padding:12px 0 14px;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.14),0 10px 14px rgba(0,0,0,.35)}
.tag{display:block;width:96px;margin:0 auto 8px;text-align:center;font-size:11px;font-weight:600;letter-spacing:2px;color:#4a545b;
  background:linear-gradient(#f4f6f7,#dde2e5);border:2px solid #8a949b;border-radius:3px;padding:1px 0}
.d3{padding:14px 0 12px}
.d3 .tag{color:transparent}

/* 폴더 */
.grid{--line:#6a737a;--ink3:#aab2b8;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px 16px}
.fd{display:flex;flex-direction:column}
.tb{align-self:flex-start;max-width:90%;display:flex;align-items:center;gap:6px;background:var(--k);color:#fff;font-size:14px;font-weight:600;padding:7px 14px;border-radius:10px 10px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb svg{width:16px;height:16px;flex:none}
.bd{flex:1;min-height:128px;background:var(--card);border:2px solid var(--k);border-radius:0 14px 14px 14px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.bd p{margin:0;font-size:14px;line-height:1.55;color:var(--ink2)}
.btn{align-self:flex-end;display:inline-flex;align-items:center;gap:6px;background:var(--k);color:#fff;text-decoration:none;font:inherit;font-size:14px;font-weight:600;padding:7px 16px;border:none;border-radius:8px;cursor:pointer}
.btn:hover{opacity:.88}
.btn svg{width:15px;height:15px}
.note{align-self:flex-end;margin:-6px 0 0;font-size:12px;color:var(--ink3)}
.dz .tb{background:transparent;color:var(--ink3);border:1px dashed var(--line);border-bottom:none;font-weight:500}
.dz .bd{background:transparent;border:1px dashed var(--line);align-items:center;justify-content:center;color:var(--ink3);font-size:14px}
.dz .bd span{display:inline-flex;align-items:center;gap:6px}
.dz svg{width:15px;height:15px}
.empty{display:none;color:#c7cdd2;padding:6px 0 0;font-size:14px;margin:0}

/* 바탕화면 설치 */
.install{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border:none;border-radius:8px;background:#1f3a5f;color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.install:hover{background:#2a4c78}
.install svg{width:16px;height:16px}
.guide{display:none;margin:0 26px 12px;background:var(--card);border:2px solid #1f3a5f;border-radius:6px;padding:12px 16px;font-size:14px;color:var(--ink2)}
.guide.show{display:block}
.guide b{color:var(--ink)}
.guide ol{margin:6px 0 4px;padding-left:20px}
.guide li{margin:2px 0}
.guide .x{float:right;border:none;background:transparent;color:var(--ink3);font:inherit;font-size:18px;line-height:1;cursor:pointer;padding:0 0 0 8px}
.guide .ok{color:#0F6E56;font-weight:600}
@media (display-mode: standalone){ .install{display:none} }

/* ===== 서랍 열림 효과 ===== */
.drawer.go{animation:pullOut 1.15s cubic-bezier(.3,.05,.25,1) both}
@keyframes pullOut{
  0%{transform:translateY(var(--from)) scale(.985)}
  72%{transform:translateY(7px) scale(1.012)}
  86%{transform:translateY(-2px) scale(1)}
  100%{transform:none}
}
.drawer.go .fd{animation:folderUp .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(1s + var(--i) * .11s)}
@keyframes folderUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.d1.tug .pull-h{animation:tug .45s ease-out both}
@keyframes tug{40%{transform:translateY(3px)}}
@media (prefers-reduced-motion: reduce){
  .drawer.go,.drawer.go .fd,.d1.tug .pull-h{animation:none}
}

/* 학교 현수막과 선생님들 */
.stage{max-width:640px;margin:34px auto 0}
.school{display:block;width:100%;height:auto;overflow:visible}
.school text{font-family:inherit}
#crowd{display:block;width:100%;height:auto;margin-top:-10px;image-rendering:pixelated;position:relative}
.floor{height:8px;background:var(--edge);border-radius:2px;margin-top:-1px}

@media (max-width:640px){
  .wrap{padding:18px 14px 24px}
  .lid{margin:0 -6px}
  .cab{padding:10px 10px 12px;gap:10px}
  .d1{padding:12px 10px 12px}
  .holder{margin:0 16px 10px;padding:5px}
  .holder::before{left:-13px}.holder::after{right:-13px}
  .holder::before,.holder::after{width:8px;height:8px;margin-top:-4px}
  .label{padding:10px 12px}
  .logo{width:42px;height:42px}
  h1{font-size:19px}
  .sub{font-size:13px}
  .tools{width:100%}
  .search{flex:1 1 100%;width:auto;min-width:0}
  .install{flex:1 1 100%;justify-content:center}
  .row,.guide{margin-left:16px;margin-right:16px}
  .box{margin:0 8px;padding:12px 14px 18px;box-shadow:inset 10px 0 0 var(--wallside),inset -10px 0 0 var(--wallside),inset 0 12px 16px rgba(0,0,0,.45)}
  .grid{grid-template-columns:1fr}
  .pull-h{width:110px}
  .feet{margin:0 20px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="lid" aria-hidden="true"></div>
  <div class="cab">
    <header class="front d1" id="d1">
      <div class="holder">
        <div class="label">
          <div class="brand">
            <div class="logo" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M7 3h9"/></svg></div>
            <div>
              <h1>CH Smart Cabinet</h1>
              <p class="sub">클릭 한 번으로 열리는 선생님의 스마트 서랍장<br>자주 쓰는 업무 프로그램부터 행정 앱까지, 필요한 모든 도구를 한곳에 쏙!</p>
            </div>
          </div>
          <div class="tools">
            <input class="search" id="q" type="search" placeholder="앱 이름 검색" aria-label="앱 이름 검색" autocomplete="off">
            <button class="install" id="install" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>바탕화면에 설치</button>
          </div>
        </div>
      </div>
      <div class="guide" id="guide" role="status" aria-live="polite"></div>
      <div class="row">
        <nav class="chips" id="chips" aria-label="카테고리"></nav>
        <div class="lock" aria-hidden="true"></div>
      </div>
      <span class="pull-h" aria-hidden="true"></span>
    </header>

    <div class="slot">
      <div class="drawer" id="drawer">
        <main class="box">
          <div class="rail" aria-hidden="true"></div>
          <div class="grid" id="grid"></div>
          <p class="empty" id="empty">찾는 앱이 없습니다. 다른 이름으로 검색해 보세요.</p>
        </main>
        <div class="front d2" id="d2" aria-hidden="true"><span class="tag">APPS</span><span class="pull-h"></span></div>
      </div>
    </div>

    <div class="front d3" aria-hidden="true"><span class="tag">·</span><span class="pull-h"></span></div>
  </div>
  <div class="plinth" aria-hidden="true"></div>
  <div class="feet" aria-hidden="true"><i></i><i></i></div>

  <footer class="stage">
    <svg class="school" viewBox="0 -9 620 70" role="img" aria-label="창현고등학교 교사 전용">
      <path d="M8 60 L8 29 L244 29 L244 16 L310 2 L376 16 L376 29 L612 29 L612 60 Z" fill="#1f3a5f" stroke="#f2c94c" stroke-width="3" stroke-linejoin="round"/>
      <line x1="310" y1="2" x2="310" y2="-8" stroke="#f2c94c" stroke-width="2"/>
      <path d="M310 -8 L324 -5 L310 -2 Z" fill="#e63946"/>
      <circle cx="310" cy="19" r="6" fill="#ffffff" stroke="#f2c94c" stroke-width="1.6"/>
      <path d="M310 19 V15.5 M310 19 L312.5 20.2" stroke="#1f3a5f" stroke-width="1.3" fill="none"/>
      <rect x="26" y="37" width="12" height="12" fill="#f2c94c"/><rect x="46" y="37" width="12" height="12" fill="#f2c94c"/>
      <rect x="562" y="37" width="12" height="12" fill="#f2c94c"/><rect x="582" y="37" width="12" height="12" fill="#f2c94c"/>
      <text x="310" y="50" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="2.5">창현고등학교 교사 전용</text>
    </svg>
    <canvas id="crowd" width="108" height="30" role="img" aria-label="창현고 선생님 30명이 손을 흔드는 픽셀 그림"></canvas>
    <div class="floor" aria-hidden="true"></div>
  </footer>
</div>

<script>
/* ===== 앱 목록: 새 앱은 아래 APPS에 항목 하나를 추가하면 됩니다 ===== */
var WEEKLY_DOWNLOAD_URL = "https://drive.google.com/drive/folders/1mmXQg5DhpObHW_YkoUu3hOLmlSXFIaje?usp=sharing";  /* 창현 위클리 설치 파일 공유 링크를 여기에 넣으세요 */

var CATS = { work: "업무", att: "출석" };

var ICONS = {
  person: '<path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
  calendar: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/>',
  chat: '<path d="M4 5h16v11H9l-5 4z"/>',
  download: '<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
  open: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>'
};

var APPS = [
  {
    cat: "att", color: "#0F6E56", icon: "person",
    tab: "자기주도학습 출석", name: "자기주도학습 출석 시스템",
    desc: "6층 자기주도학습실 좌석 배치도로 출석을 확인하고 기록합니다.",
    url: "https://self-study-attendance.vercel.app", action: "열기"
  },
  {
    cat: "work", color: "#185FA5", icon: "calendar",
    tab: "창현 위클리", name: "창현 위클리",
    desc: "학사일정, 급식, 날씨를 모니터 위에서 한눈에 보는 2주 스케줄러입니다.",
    url: WEEKLY_DOWNLOAD_URL, action: "다운로드"
  },
  {
    cat: "work", color: "#993C1D", icon: "chat",
    tab: "업무 소통방", name: "창현고 업무 소통방",
    desc: "업무 안건을 올리고 함께 확인하는 소통 공간입니다.",
    url: "https://changhyun-meeting.vercel.app", action: "열기"
  }
];
/* ================================================================ */

function svg(name){
  return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>';
}
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}

var state = { cat: "all", q: "" };

function buildChips(){
  var seen = {}, html = '<button class="chip on" data-c="all">전체</button>';
  APPS.forEach(function(a){
    if (!seen[a.cat]) {
      seen[a.cat] = true;
      html += '<button class="chip" data-c="' + esc(a.cat) + '">' + esc(CATS[a.cat] || a.cat) + '</button>';
    }
  });
  var nav = document.getElementById("chips");
  nav.innerHTML = html;
  nav.addEventListener("click", function(e){
    var b = e.target.closest(".chip");
    if (!b) return;
    nav.querySelectorAll(".chip").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on");
    state.cat = b.getAttribute("data-c");
    render();
  });
}

function folder(a, i){
  var btn = a.url
    ? '<a class="btn" href="' + esc(a.url) + '" target="_blank" rel="noopener noreferrer">' + svg(a.action === "다운로드" ? "download" : "open") + esc(a.action) + '</a>'
    : '<button class="btn" type="button" data-pending="1">' + svg("download") + esc(a.action) + '</button><span class="note" hidden>링크 준비 중입니다.</span>';
  return '<div class="fd" style="--k:' + a.color + ';--i:' + i + '">' +
    '<div class="tb">' + svg(a.icon) + esc(a.tab) + '</div>' +
    '<div class="bd"><p>' + esc(a.desc) + '</p>' + btn + '</div></div>';
}

function render(){
  var q = state.q.trim().toLowerCase();
  var list = APPS.filter(function(a){
    var okC = state.cat === "all" || a.cat === state.cat;
    var okQ = !q || (a.name + " " + a.tab).toLowerCase().indexOf(q) > -1;
    return okC && okQ;
  });
  var html = list.map(folder).join("");
  if (state.cat === "all" && !q) {
    html += '<div class="fd dz" style="--i:' + list.length + '"><div class="tb">새 폴더</div><div class="bd"><span>' + svg("plus") + '추가 예정</span></div></div>';
  }
  document.getElementById("grid").innerHTML = html;
  document.getElementById("empty").style.display = list.length ? "none" : "block";
}

document.getElementById("grid").addEventListener("click", function(e){
  var b = e.target.closest("[data-pending]");
  if (!b) return;
  var note = b.parentNode.querySelector(".note");
  if (note) note.hidden = false;
});
document.getElementById("q").addEventListener("input", function(e){
  state.q = e.target.value;
  render();
});

buildChips();
render();

/* ===== 서랍 열림 효과: 처음 열 때 한 번만 ===== */
(function(){
  var drawer = document.getElementById("drawer");
  var d1 = document.getElementById("d1");
  var d2 = document.getElementById("d2");
  var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (still || !drawer.animate && !("animation" in document.body.style)) return;
  var from = -(drawer.offsetHeight - d2.offsetHeight);
  drawer.style.setProperty("--from", from + "px");
  drawer.style.transform = "translateY(" + from + "px) scale(.985)";
  setTimeout(function(){
    d1.classList.add("tug");
    setTimeout(function(){
      drawer.style.transform = "";
      drawer.classList.add("go");
    }, 250);
  }, 150);
  setTimeout(function(){
    drawer.classList.remove("go");
    d1.classList.remove("tug");
  }, 2600);
})();

/* ===== 바탕화면에 설치 ===== */
(function(){
  var btn = document.getElementById("install");
  var guide = document.getElementById("guide");
  var deferred = null;

  var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  if (standalone) { btn.style.display = "none"; }

  function show(html){
    guide.innerHTML = '<button class="x" type="button" aria-label="안내 닫기">×</button>' + html;
    guide.classList.add("show");
  }
  guide.addEventListener("click", function(e){
    if (e.target.closest(".x")) guide.classList.remove("show");
  });

  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferred = e;
  });
  window.addEventListener("appinstalled", function(){
    deferred = null;
    btn.style.display = "none";
    show('<span class="ok">설치 완료!</span> 이제 바탕화면의 <b>CH Smart Cabinet</b> 아이콘을 누르면 바로 서랍이 열립니다.<br>Edge에서 설치하셨다면, 이어서 뜨는 창에서 <b>“바탕 화면 바로 가기 만들기”</b>에 체크해 주세요.');
  });

  function manualGuide(){
    var ua = navigator.userAgent;
    var isIOS = /iPhone|iPad|iPod/.test(ua);
    var isAndroid = /Android/.test(ua);
    var isEdge = /Edg\//.test(ua);
    var isChrome = /Chrome\//.test(ua) && !isEdge;
    if (isIOS) {
      show('<b>아이폰·아이패드에서 설치하기</b><ol><li>사파리 아래쪽의 <b>공유 버튼</b>(네모에 위쪽 화살표)을 누릅니다.</li><li><b>홈 화면에 추가</b>를 누르고 <b>추가</b>를 누릅니다.</li></ol>');
    } else if (isAndroid) {
      show('<b>안드로이드 폰에서 설치하기</b><ol><li>크롬 오른쪽 위 <b>⋮</b> 메뉴를 누릅니다.</li><li><b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 누릅니다.</li></ol>');
    } else if (isEdge) {
      show('<b>Edge에서 설치하기</b><ol><li>오른쪽 위 <b>⋯</b> 메뉴를 누릅니다.</li><li><b>앱 → 이 사이트를 앱으로 설치</b>를 누르고 <b>설치</b>를 누릅니다.</li><li>이어서 뜨는 창에서 <b>“바탕 화면 바로 가기 만들기”</b>에 체크합니다.</li></ol>이미 설치하셨다면 바탕화면이나 시작 메뉴의 <b>CH Smart Cabinet</b>을 찾아 보세요.');
    } else if (isChrome) {
      show('<b>크롬에서 설치하기</b><ol><li>주소창 오른쪽 끝의 <b>설치 아이콘</b>(모니터에 화살표)을 누릅니다.</li><li>안 보이면 오른쪽 위 <b>⋮ → 전송, 저장, 공유 → 페이지를 앱으로 설치</b>를 누릅니다.</li></ol>이미 설치하셨다면 바탕화면이나 시작 메뉴의 <b>CH Smart Cabinet</b>을 찾아 보세요.');
    } else {
      show('이 브라우저에서는 설치 버튼이 지원되지 않습니다. <b>Edge</b>나 <b>크롬</b>으로 이 주소를 열어 다시 눌러 주세요.');
    }
  }

  btn.addEventListener("click", function(){
    if (!deferred) { manualGuide(); return; }
    deferred.prompt();
    deferred.userChoice.then(function(choice){
      if (choice.outcome !== "accepted") {
        show('설치를 취소하셨습니다. 필요할 때 다시 <b>바탕화면에 설치</b>를 눌러 주세요.');
      }
      deferred = null;
    });
  });

  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("/sw.js").catch(function(){});
  }
})();

/* ===== 픽셀 선생님 30명 ===== */
(function(){
  var cv = document.getElementById("crowd");
  var cx = cv.getContext && cv.getContext("2d");
  if (!cx) return;

  function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  var R = rng(2027);
  function pick(a){ return a[Math.floor(R()*a.length)]; }

  var SKIN=['#f2c9a0','#e0a878','#c68642','#8d5524','#ffdbb4'];
  var HAIR=['#2b1b0e','#4a2c17','#8b5a2b','#d9a441','#1c1c1c','#a52a2a','#808080'];
  var SHIRT=['#e63946','#f4a261','#2a9d8f','#457b9d','#9b5de5','#f15bb5','#06d6a0','#ffd166','#118ab2','#ef476f','#8ac926','#ff924c'];
  var PANTS=['#2b2d42','#3a506b','#5c4033','#6c757d','#1d3557','#344e41'];
  var ARMS={
    down:[[1,8,'s'],[1,9,'s'],[1,10,'k']],
    up:[[1,8,'s'],[0,7,'s'],[0,6,'s'],[0,5,'k']],
    wave:[[1,8,'s'],[0,7,'k']],
    out:[[1,8,'s'],[0,8,'k']],
    hip:[[1,8,'s'],[0,9,'k']]
  };
  var ALT={down:'down',up:'wave',wave:'up',out:'hip',hip:'out'};
  var POSES=[['down','up'],['up','down'],['up','up'],['out','out'],['hip','up'],['wave','down'],['down','wave'],['up','hip'],['wave','wave'],['out','down'],['hip','hip'],['down','down']];

  var people = [];
  for (var r=0; r<3; r++){
    for (var i=0; i<10; i++){
      people.push({
        x:(r%2?5:0)+i*10+Math.round((R()-.5)*2), y:2+r*6,
        skin:pick(SKIN), hair:pick(HAIR), shirt:pick(SHIRT), pants:pick(PANTS),
        style:Math.floor(R()*3), pose:pick(POSES),
        speed:2+Math.floor(R()*3), phase:Math.floor(R()*4), bob:R()<.35, blink:0
      });
    }
  }

  function draw(o, f){
    var alt = f%2===1;
    var oy = o.y + (o.bob && alt ? -1 : 0);
    function P(x,y,w,h,c){ cx.fillStyle=c; cx.fillRect(o.x+x, oy+y, w, h); }
    P(2,11,2,2,o.pants); P(5,11,2,2,o.pants); P(2,13,2,1,'#222'); P(5,13,2,1,'#222');
    P(2,8,5,3,o.shirt);
    [0,1].forEach(function(side){
      var pose = alt ? ALT[o.pose[side]] : o.pose[side];
      ARMS[pose].forEach(function(a){
        P(side ? 8-a[0] : a[0], a[1], 1, 1, a[2]==='k' ? o.skin : o.shirt);
      });
    });
    P(1,2,7,6,o.skin);
    P(2,1,5,1,o.hair); P(1,2,7,1,o.hair);
    if (o.style===1){ P(1,3,1,3,o.hair); P(7,3,1,3,o.hair); }
    if (o.style===2){ P(3,0,3,1,o.hair); }
    var eye = o.blink>0 ? '#7a4a2a' : '#222';
    P(3,5,1,1,eye); P(5,5,1,1,eye);
    P(4,6,1,1, alt && o.bob ? '#d9534f' : '#b5483a');
  }

  var tick = 0;
  function frame(){
    cx.clearRect(0,0,cv.width,cv.height);
    people.forEach(function(o){
      if (o.blink>0) o.blink--;
      else if (Math.random()<.04) o.blink=1;
      draw(o, Math.floor((tick+o.phase)/o.speed));
    });
    tick++;
  }
  frame();
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!still) setInterval(frame, 220);
})();
</script>
